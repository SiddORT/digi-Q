        clinic:
          type: object
          required: [name, address]
          properties:
            dateFormat: { $ref: "#/components/schemas/ClinicDateFormat" }
            timeFormat: { $ref: "#/components/schemas/ClinicTimeFormat" }
            slug: { type: string, minLength: 3, maxLength: 63 }
            categoryId: { type: string }
            specialityIds: { type: array, items: { type: string } }
            referralCode: { type: [string, "null"], maxLength: 100 }
            name: { type: string, minLength: 1 }
            code: { type: string }
            phone: { type: string }
            email: { type: string, format: email }
            address: { type: string }
            city: { type: string }
            state: { type: string }
            pincode: { type: string }
            timezone: { type: string, default: Asia/Kolkata }
    ClinicAdminOnboardingResult:
      type: object
      required: [admin, clinic]
      properties:
        branches: { type: array, items: { $ref: "#/components/schemas/Branch" } }
