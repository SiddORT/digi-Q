    get:
      operationId: getAppointmentQr
      description: Returns a signed, appointment-specific QR payload to the appointment owner or authorized scoped staff.
      responses:
        "200": { description: Appointment QR payload, content: { application/json: { schema: { $ref: "#/components/schemas/AppointmentQr" } } } }
  /appointment-qr/resolve:
    post:
      operationId: resolveAppointmentQr
      description: Resolves an appointment QR for authorized operational staff without changing appointment state.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AppointmentQrPayload" } } } }
      responses:
        "200": { description: Appointment QR eligibility, content: { application/json: { schema: { $ref: "#/components/schemas/AppointmentQrResolution" } } } }
  /appointment-qr/check-in:
    post:
      operationId: checkInAppointmentQr
      description: After explicit staff confirmation, enters consultation for the called or first pending reservation. Stamps checkedInAt and consultationStartedAt. Repeated scans of a current consultation are idempotent; never enqueues or bypasses reservation order.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AppointmentQrPayload" } } } }
      responses:
        "200": { description: Appointment QR check-in result, content: { application/json: { schema: { $ref: "#/components/schemas/AppointmentQrCheckInResult" } } } }
  /doctors/{id}/duration/{clinicId}:
    get:
      operationId: getDoctorDuration
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: clinicId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Clinic-specific duration, content: { application/json: { schema: { $ref: "#/components/schemas/DoctorDuration" } } } }
    patch:
      operationId: updateDoctorDuration
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: clinicId, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DoctorDurationInput" } } } }
      responses:
        "200": { description: Saved duration, content: { application/json: { schema: { $ref: "#/components/schemas/DoctorDuration" } } } }
  /appointments/{id}/reschedule:
    post:
      operationId: rescheduleAppointment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AppointmentReschedule" } } } }
      responses:
        "200": { description: Rescheduled atomically, content: { application/json: { schema: { $ref: "#/components/schemas/Appointment" } } } }
  /appointments/{id}/actions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: transitionAppointment
      description: |
        New bookings immediately enter waiting with a stable token.
        checkIn called (or first pending with no current patient)→inConsultation,
        stamping checkedInAt and consultationStartedAt.
        complete inConsultation→completed and atomically calls the next pending reservation.
        Legacy booked/checkedIn reservations remain usable without migration.
        Compatibility enqueue normalizes legacy pending to waiting; call pending→called; start called→inConsultation.
        noShow pending/called→noShow requires reason; requeue noShow→waiting requires reason, position and fresh versions.
        cancel booked/checkedIn/waiting/called→cancelled only before checkedInAt and within cutoff.
        Queue actions are appointment-date-only, serialized per session, and never automatically skip patients.
        Patients may cancel only self. All other actions require scoped staff.
        Concurrent state conflicts return 409. Every transition is audited.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AppointmentAction" } } } }
      responses:
        "200": { description: Updated lifecycle, content: { application/json: { schema: { $ref: "#/components/schemas/Appointment" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /queue:
    get:
      operationId: getQueue
      description: Poll every 30 seconds. Patients get aggregate tokens/counts and own entry only; identifiable entries and staff listing metadata are omitted. Staff receive scoped identifiable entries. Explicit page or pageSize enables database-backed staff pagination; omission preserves the legacy full-list response. Staff search, sort, status and statusGroup filters apply before pagination. Listing counts never replace the session-wide queue aggregates.
      parameters:
        - { name: sessionId, in: query, schema: { type: string } }
        - { name: startTime, in: query, schema: { type: string } }
        - { name: doctorId, in: query, required: true, schema: { type: string } }
        - { name: branchId, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: appointmentId, in: query, schema: { type: string } }
        - { name: page, in: query, description: Explicit staff listing page; omit both pagination parameters for legacy full-list compatibility, schema: { type: integer, minimum: 1 } }
        - { name: pageSize, in: query, description: Explicit staff listing page size; omitted pagination parameters must not be default-injected by clients, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: search, in: query, description: Staff-only listing search applied before pagination, schema: { type: string, maxLength: 200 } }
        - { name: sort, in: query, description: Staff-only allowlisted listing sort with optional minus prefix, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/AppointmentStatus" } }
        - { $ref: "#/components/parameters/StatusGroup" }
      responses:
        "200": { description: Live queue, content: { application/json: { schema: { $ref: "#/components/schemas/LiveQueue" } } } }
  /queue/call-next:
    post:
      operationId: callNext
      description: Scoped staff only. Locks doctor/branch/date queue; calls oldest waiting entry, rejecting another active consultation. Empty queue returns appointment null.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/QueueSelection" } } } }
      responses:
        "200": { description: Called next, content: { application/json: { schema: { $ref: "#/components/schemas/CallNextResult" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /qrs:
    get:
      operationId: listQrs
      parameters: [{ $ref: "#/components/parameters/Search" }, { $ref: "#/components/parameters/Sort" }, { $ref: "#/components/parameters/ClinicId" }, { $ref: "#/components/parameters/BranchId" }, { $ref: "#/components/parameters/DoctorId" }, { $ref: "#/components/parameters/Status" }, { $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }]
      responses:
        "200": { description: Scoped QR configurations, content: { application/json: { schema: { $ref: "#/components/schemas/QrList" } } } }
    post:
      operationId: createQr
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/QrInput" } } } }
      responses:
        "201": { description: Secure public URL for QR rendering/download/print, content: { application/json: { schema: { $ref: "#/components/schemas/Qr" } } } }
  /qrs/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: getQr
      responses:
        "200": { description: QR, content: { application/json: { schema: { $ref: "#/components/schemas/Qr" } } } }
    patch:
      operationId: updateQr
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/QrInput" } } } }
      responses:
        "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Qr" } } } }
    delete:
      operationId: deleteQr
      responses:
        "204": { description: Deactivated public reference }
  /qrs/{id}/regenerate:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: regenerateQr
      description: Revokes previous reference and generates a cryptographically random replacement.
      responses:
        "200": { description: New reference, content: { application/json: { schema: { $ref: "#/components/schemas/Qr" } } } }
  /dashboard:
    get:
      operationId: getDashboard
      parameters: [{ $ref: "#/components/parameters/Date" }, { $ref: "#/components/parameters/ClinicId" }, { $ref: "#/components/parameters/BranchId" }, { $ref: "#/components/parameters/DoctorId" }]
      responses:
        "200": { description: Role-scoped database aggregates, content: { application/json: { schema: { $ref: "#/components/schemas/Dashboard" } } } }
  /reports:
    get:
      operationId: getReports
      parameters:
        - { name: search, in: query, description: Trimmed report search text, schema: { type: string, maxLength: 200 } }
        - { name: sort, in: query, description: Outcomes orders by cancelled then no-show then residual Other counts. Other equals visits minus completed minus cancelled minus no-show. Group key ascending breaks ties., schema: { type: string, enum: [key, "-key", label, "-label", appointments, "-appointments", outcomes, "-outcomes", other, "-other", registrations, "-registrations", waiting, "-waiting", checkedIn, "-checkedIn", completed, "-completed", noShow, "-noShow", cancelled, "-cancelled", averageWaitMinutes, "-averageWaitMinutes", averageConsultationMinutes, "-averageConsultationMinutes"] } }
        - { $ref: "#/components/parameters/SessionId" }
        - { $ref: "#/components/parameters/StartTime" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/ClinicId" }
        - { $ref: "#/components/parameters/BranchId" }
        - { $ref: "#/components/parameters/DoctorId" }
        - { name: groupBy, in: query, schema: { type: string, enum: [clinic, doctor, date], default: date } }
      responses:
        "200": { description: Scoped appointment/registration/queue performance report, content: { application/json: { schema: { $ref: "#/components/schemas/Report" } } } }
  /audit-logs:
    get:
      operationId: listAuditLogs
      description: Admin-only scoped summaries; sensitive old/new values are redacted.
      parameters: [{ $ref: "#/components/parameters/Search" }, { $ref: "#/components/parameters/Sort" }, { name: activityType, in: query, schema: { type: string, enum: [all, operational, security], default: all } }, { name: entityType, in: query, schema: { type: string } }, { name: actorId, in: query, schema: { type: string } }, { $ref: "#/components/parameters/ClinicId" }, { $ref: "#/components/parameters/From" }, { $ref: "#/components/parameters/To" }, { $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }]
      responses:
        "200": { description: Immutable audit summaries, content: { application/json: { schema: { $ref: "#/components/schemas/AuditLogList" } } } }
  /settings:
    get:
      operationId: getSettings
      description: Authenticated safe configuration only; provider credentials never returned.
      responses:
        "200": { description: Settings, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
    patch:
      operationId: updateSettings
      description: Super admin only.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SettingsInput" } } } }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/Settings" } } } }
  /notifications:
    get:
      operationId: listNotifications
      description: In-app events derived from real scoped appointment status history and, for administrators, operational audit records from the last 30 days. Per-user persistent read state. No email is sent.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [all, appointments, queue, system], default: all } }
      responses:
        "200": { description: Notifications, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationList" } } } }
  /notifications/read:
    post:
      operationId: markNotificationsRead
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationReadInput" } } } }
      responses:
        "200": { description: Updated unread count, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationUnread" } } } }
  /workspaces:
    get:
      operationId: listWorkspaces
      description: Clinic memberships of the signed-in staff user and the active workspace. Switching only narrows scope to one assigned clinic.
      responses:
        "200": { description: Workspaces, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceList" } } } }
  /workspaces/active:
    put:
      operationId: selectWorkspace
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceSelect" } } } }
      responses:
        "200": { description: Active workspace, content: { application/json: { schema: { $ref: "#/components/schemas/WorkspaceList" } } } }
  /patients/{id}/documents:
    get:
      operationId: listPatientDocuments
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Documents visible in your clinic scope, content: { application/json: { schema: { $ref: "#/components/schemas/PatientDocumentList" } } } }
    post:
      operationId: uploadPatientDocument
      description: Private upload (PDF, PNG, JPEG, WebP or plain text, at most 10 MB). Requires CSRF header. Stored privately; never publicly addressable.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: name, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 160 } }
        - { name: clinicId, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { $ref: "#/components/schemas/DocumentBinary" } }
      responses:
        "201": { description: Stored, content: { application/json: { schema: { $ref: "#/components/schemas/PatientDocument" } } } }
  /patient-documents/{id}:
    get:
      operationId: downloadPatientDocument
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: File bytes, content: { application/octet-stream: { schema: { $ref: "#/components/schemas/DocumentBinary" } } } }
    delete:
      operationId: deletePatientDocument
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Removed and audited }
  /patients/{id}/activity:
    get:
      operationId: listPatientActivity
      description: All recorded appointment status changes for this patient within your scope, newest first.
      parameters: [{ $ref: "#/components/parameters/Id" }, { $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PageSize" }]
      responses:
        "200": { description: Activity page, content: { application/json: { schema: { $ref: "#/components/schemas/PatientActivityPage" } } } }
  /reports/trends:
    get:
      operationId: getReportTrends
      parameters: [{ $ref: "#/components/parameters/From" }, { $ref: "#/components/parameters/To" }, { $ref: "#/components/parameters/ClinicId" }, { $ref: "#/components/parameters/BranchId" }, { $ref: "#/components/parameters/DoctorId" }]
      responses:
        "200": { description: Daily scoped aggregates, content: { application/json: { schema: { $ref: "#/components/schemas/ReportTrend" } } } }
  /search/records:
    get:
      operationId: searchRecords
      description: Scoped queue and appointment record search by token, reference or patient name. Search text is never stored.
      parameters: [{ name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }]
      responses:
        "200": { description: Matches, content: { application/json: { schema: { $ref: "#/components/schemas/RecordSearchResult" } } } }
  /saved-views:
    get:
      operationId: listSavedViews
      parameters: [{ name: tableKey, in: query, required: true, schema: { type: string, maxLength: 60 } }]
      responses:
        "200": { description: Own and role-shared views, content: { application/json: { schema: { $ref: "#/components/schemas/SavedViewList" } } } }
    post:
      operationId: createSavedView
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SavedViewInput" } } } }
      responses:
        "201": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/SavedViewRecord" } } } }
  /saved-views/{id}:
    delete:
      operationId: deleteSavedView
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted }
components:
  securitySchemes:
    NativeSession:
      type: apiKey
      in: cookie
      name: digiq_session
      description: Opaque native token (default) or explicitly enabled app-issued JWT. Both are database-revocable, fixed 12-hour HttpOnly/Secure/SameSite=Lax cookies. No refresh endpoint.
  responses:
    Error:
      description: Request failed
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
  parameters:
    SessionId: { name: sessionId, in: query, schema: { type: string } }
    StartTime: { name: startTime, in: query, schema: { type: string } }
    SelectedIds: { name: selectedIds, in: query, description: Comma-separated exact IDs within existing scope (maximum 100)., schema: { type: string, maxLength: 10000 } }
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Search: { name: search, in: query, schema: { type: string } }
    PublicDirectory: { name: directory, in: query, description: Opt in to scoped server pagination; omitted preserves the legacy context arrays., schema: { type: boolean } }
    PublicDirectoryPage: { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 1000000 } }
    PublicDirectoryPageSize: { name: pageSize, in: query, schema: { type: integer, enum: [10, 25, 50, 100] } }
    PublicDirectorySearch: { name: search, in: query, description: Matches public clinic name/address/city or doctor name/specialization only., schema: { type: string, maxLength: 200 } }
    PublicDirectorySort: { name: sort, in: query, description: Public name with optional minus prefix; sorting never uses private fields., schema: { type: string, enum: [name, "-name"] } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Sort: { name: sort, in: query, description: Allowlisted field with optional minus prefix for descending order, schema: { type: string } }
    Status: { name: status, in: query, schema: { type: string, enum: [active, inactive] } }
    StatusGroup: { name: statusGroup, in: query, description: Server-side group filter applied before pagination; intersects with status when both supplied, schema: { type: string, enum: [active, waiting, absent, completed, cancelled, all] } }
    ClinicId: { name: clinicId, in: query, schema: { type: string } }
    BranchId: { name: branchId, in: query, schema: { type: string } }
    DoctorId: { name: doctorId, in: query, schema: { type: string } }
    Date: { name: date, in: query, schema: { type: string, format: date } }
    From: { name: from, in: query, schema: { type: string, format: date } }
    To: { name: to, in: query, schema: { type: string, format: date } }
  schemas:
    GeographySuggestions:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { type: string } }
        compatible: { type: boolean, description: "Whether the given city belongs to the given state; true when the directory cannot judge" }
    TicketEmailInput:
      type: object
      required: [requestId, recipient]
      properties:
        requestId: { type: string, format: uuid }
        recipient: { type: string, format: email }
    TicketEmailPreview:
      type: object
      required: [recipient, eligible, reason]
      properties:
        recipient: { type: string }
        eligible: { type: boolean }
        reason: { type: string }
    TicketEmailResult:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [provider_accepted, unknown] }
    AppointmentCalendarDay:
      type: object
      required: [date, total, byStatus]
      properties:
        date: { type: string }
        total: { type: integer }
        byStatus: { type: object, additionalProperties: { type: integer } }
    AppointmentCalendar:
      type: object
      required: [days, total]
      properties:
        days: { type: array, items: { $ref: "#/components/schemas/AppointmentCalendarDay" } }
        total: { type: integer }
    DocumentBinary: { type: string, format: binary }
    WorkspaceNotification:
      type: object
      required: [id, kind, title, createdAt, read]
      properties:
        id: { type: string }
        kind: { type: string, enum: [appointments, queue, system] }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
        appointmentId: { type: string, nullable: true }
        date: { type: string, nullable: true }
    NotificationList:
      type: object
      required: [items, unread]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/WorkspaceNotification" } }
        unread: { type: integer }
    NotificationUnread:
      type: object
      required: [unread]
      properties: { unread: { type: integer } }
    NotificationReadInput:
      type: object
      properties:
        ids: { type: array, maxItems: 100, items: { type: string, maxLength: 120 } }
        all: { type: boolean }
    WorkspaceOption:
      type: object
      required: [id, name]
      properties: { id: { type: string }, name: { type: string } }
    WorkspaceList:
      type: object
      required: [switchable, workspaces]
      properties:
        activeClinicId: { type: string, nullable: true }
        switchable: { type: boolean }
        workspaces: { type: array, items: { $ref: "#/components/schemas/WorkspaceOption" } }
    WorkspaceSelect:
      type: object
      required: [clinicId]
      properties: { clinicId: { type: string, nullable: true } }
    PatientDocument:
      type: object
      required: [id, patientId, clinicId, name, contentType, size, createdAt]
      properties:
        id: { type: string }
        patientId: { type: string }
        clinicId: { type: string }
        clinicName: { type: string }
        name: { type: string }
        contentType: { type: string }
        size: { type: integer }
        createdAt: { type: string, format: date-time }
        uploadedByName: { type: string }
    PatientDocumentList:
      type: object
      required: [items, uploadClinicIds]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PatientDocument" } }
        uploadClinicIds: { type: array, items: { type: string } }
    PatientActivityItem:
      type: object
      required: [id, appointmentId, toStatus, occurredAt, reference, doctorName, date]
      properties:
        id: { type: string }
        appointmentId: { type: string }
        fromStatus: { type: string, nullable: true }
        toStatus: { type: string }
        occurredAt: { type: string, format: date-time }
        reference: { type: string }
        doctorName: { type: string }
        date: { type: string }
        actorName: { type: string, nullable: true }
    PatientActivityPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PatientActivityItem" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    ReportTrendPoint:
      type: object
      required: [date, appointments, completed, cancelled, noShow, waiting]
      properties:
        date: { type: string }
        appointments: { type: integer }
        completed: { type: integer }
        cancelled: { type: integer }
        noShow: { type: integer }
        waiting: { type: integer }
    ReportTrend:
      type: object
      required: [from, to, points]
      properties:
        from: { type: string }
        to: { type: string }
        points: { type: array, items: { $ref: "#/components/schemas/ReportTrendPoint" } }
    RecordSearchItem:
      type: object
      required: [id, reference, patientName, doctorName, tokenNumber, date, status, today, clinicId, branchId, doctorId]
      properties:
        id: { type: string }
        clinicId: { type: string, description: Visit clinic, used to open the exact queue session. }
        branchId: { type: string }
        doctorId: { type: string }
        startTime: { type: string, nullable: true, description: Session start time when the visit belongs to a timed session. }
        sessionId: { type: string, nullable: true }
        reference: { type: string }
        patientName: { type: string }
        doctorName: { type: string }
        tokenNumber: { type: integer }
        token: { type: string }
        date: { type: string }
        status: { type: string }
        today: { type: boolean }
    RecordSearchResult:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: "#/components/schemas/RecordSearchItem" } } }
    SavedViewColumns:
      type: object
      required: [order, hidden]
      properties:
        order: { type: array, maxItems: 40, items: { type: string, maxLength: 60 } }
        hidden: { type: array, maxItems: 40, items: { type: string, maxLength: 60 } }
        pinned: { type: string, nullable: true, maxLength: 60 }
    SavedViewInput:
      type: object
      required: [tableKey, name, filters]
      properties:
        tableKey: { type: string, maxLength: 60 }
        name: { type: string, minLength: 1, maxLength: 60 }
        filters: { type: object, additionalProperties: { type: string, maxLength: 80 } }
        columns: { $ref: "#/components/schemas/SavedViewColumns" }
        shareWithRole: { type: boolean }
    SavedViewRecord:
      type: object
      required: [id, tableKey, name, filters, ownedByMe, shared]
      properties:
        id: { type: string }
        tableKey: { type: string }
        name: { type: string }
        filters: { type: object, additionalProperties: { type: string } }
