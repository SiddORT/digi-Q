            id: { type: string }
            managingAdminId: { type: [string, "null"] }
            managingAdminName: { type: [string, "null"] }
            invitationStatus: { type: string, enum: [sent, failed, notRequired] }
            passwordEnabled: { type: boolean, description: Whether this staff record has a local password configured. }
            createdAt: { type: [string, "null"], format: date-time }
            lastLoginAt: { type: [string, "null"], format: date-time }
    ClinicAdminOnboardingInput:
      type: object
      required: [admin, clinic]
      properties:
        branches: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/ClinicBranchSetup" } }
