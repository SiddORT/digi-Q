    get:
      operationId: healthCheck
      security: []
      responses:
        "200": { description: Healthy, content: { application/json: { schema: { $ref: "#/components/schemas/HealthStatus" } } } }
  /auth/csrf:
    get:
      operationId: getAuthCsrf
      security: []
      responses:
        "200": { description: CSRF cookie and token, content: { application/json: { schema: { type: object, required: [csrfToken], properties: { csrfToken: { type: string } } } } } }
  /auth/login:
    post:
      operationId: nativeStaffLogin
      security: []
      description: Verify the local staff password with Argon2id and create a session directly. No email code or SMTP delivery is required.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NativeStaffLoginInput" } } } }
      responses:
        "200": { description: Staff session created, content: { application/json: { schema: { $ref: "#/components/schemas/StaffLoginResponse" } } } }
        "503": { description: "Session issuance unavailable; code AUTH_SESSION_UNCONFIGURED when session mode or signing key is invalid." }
  /auth/verify-device:
    post:
      operationId: verifyStaffDevice
      deprecated: true
      description: Retired compatibility tombstone. Use staff email and password login; no payload can create a session.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuthCodeInput" } } } }
      responses:
        "410": { description: "Device verification retired; code AUTH_METHOD_REMOVED. No session is issued." }
        "503": { description: "Session issuance unavailable; code AUTH_SESSION_UNCONFIGURED when session mode or signing key is invalid." }
  /auth/patient/start:
    post:
      operationId: startPatientEmail
      security: []
      description: Requests email login (including new patients) or SMS login for existing active patient accounts. Email outcome is always not_reported to protect eligibility. Optional registration SMS proves only the supplied phone, independently of email eligibility, and returns its safe channel outcome. SMS login uses the platform patient-login template, bypasses optional notification gates and never returns the code.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PatientLoginStartInput" } } } }
      responses:
        "200": { description: Patient challenge, content: { application/json: { schema: { $ref: "#/components/schemas/AuthChallenge" } } } }
  /auth/patient/resend:
    post:
      operationId: resendPatientEmailCode
      security: []
      description: Rotates an eligible email code on the same intent, preserving optional phone proof, original expiry and attempt limits. Generic response does not confirm account matching or delivery.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationChallengeReference" } } } }
      responses:
        "200": { description: Generic challenge reference, content: { application/json: { schema: { $ref: "#/components/schemas/AuthChallenge" } } } }
  /auth/patient/verify:
    post:
      operationId: verifyPatientEmail
      security: []
      description: Consumes a single-use patient code for its exact delivery channel and establishes an HTTP-only session. SMS never creates users or verifies email ownership.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PatientLoginVerifyInput" } } } }
      responses:
        "200": { description: Patient session created, content: { application/json: { schema: { $ref: "#/components/schemas/AuthAuthenticated" } } } }
        "503": { description: "Session issuance unavailable; code AUTH_SESSION_UNCONFIGURED when session mode or signing key is invalid." }
  /auth/registration/mobile/request:
    post:
      operationId: requestRegistrationMobileCode
      security: []
      description: Requests a separate optional phone code for a pending email registration intent. Does not create a session or verify email.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationChallengeReference" } } } }
      responses:
        "200": { description: SMS transport outcome only, content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationMobileOutcome" } } } }
  /auth/registration/mobile/verify:
    post:
      operationId: verifyRegistrationMobileCode
      security: []
      description: Verifies only the intent-bound phone. Required email proof remains independent. No account merge or login.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuthCodeInput" } } } }
      responses:
        "200": { description: Mobile proof recorded on the pending intent, content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationMobileProof" } } } }
  /auth/register/start:
    post:
      operationId: startClinicRegistration
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StartClinicRegistrationInput" } } } }
      responses:
        "200": { description: Registration challenge, content: { application/json: { schema: { $ref: "#/components/schemas/AuthChallenge" } } } }
  /auth/registration/resend:
    post:
      operationId: resendClinicRegistration
      security: []
      description: Resends the registration verification code for the existing challenge without changing its ID or original expiry. Uses the anonymous CSRF cookie and matching CSRF request header; no authenticated session is required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationChallengeReference" }
      responses:
        "200":
          description: Code sent for the same stable challenge ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationChallengeReference" }
        "400":
          description: Invalid or expired challenge (INVALID_VERIFICATION)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429":
          description: Resend cooldown (REGISTRATION_RESEND_COOLDOWN); IP abuse limits may also return rate limiting
          headers:
            Retry-After:
              description: Cooldown retry delay, 60 seconds for REGISTRATION_RESEND_COOLDOWN
              schema: { type: string, example: "60" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /auth/registration/resume:
    post:
      operationId: resumeClinicRegistration
      security: []
      description: Resumes a matching unexpired verification challenge from an HttpOnly cookie; the temporary account draft has no challenge reference.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationResumeIdentity" } } } }
      responses:
        "200": { description: Matching challenge or null, content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationResumeResult" } } } }
  /auth/register/verify:
    post:
      operationId: verifyClinicRegistration
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuthCodeInput" } } } }
      responses:
        "200": { description: Administrator created, content: { application/json: { schema: { $ref: "#/components/schemas/AuthAuthenticated" } } } }
  /auth/forgot-password:
