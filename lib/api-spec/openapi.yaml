  /auth/logout:
    post:
      operationId: logoutNativeSession
      responses:
        "200": { description: Session revoked, content: { application/json: { schema: { type: object, required: [authenticated], properties: { authenticated: { type: boolean } } } } } }
  /auth/status:
    get:
      operationId: getAuthStatus
      security: []
      description: Returns role and local session state, with no clinical data. Does not issue a CSRF cookie or token; use GET /auth/csrf for that.
      responses:
        "200": { description: Authentication status, content: { application/json: { schema: { $ref: "#/components/schemas/AuthStatus" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /me:
    get:
      operationId: getMe
      description: Returns database identity; user is null before onboarding. Never accepts a role from the client.
      responses:
        "200": { description: Identity, content: { application/json: { schema: { $ref: "#/components/schemas/Identity" } } } }
    patch:
      operationId: updateMe
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileInput" } } } }
