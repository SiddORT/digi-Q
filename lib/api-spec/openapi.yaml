            revision: { type: integer }
            expectedDurationMinutes: { type: [integer, "null"] }
            status: { $ref: "#/components/schemas/AppointmentStatus" }
            patientName: { type: string }
            patientCode: { type: string }
            doctorName: { type: string }
            clinicName: { type: string }
            branchName: { type: string }
            branchAddress: { type: [string, "null"], description: "Booking branch address snapshot; for legacy bookings the current branch address is resolved." }
            timezone: { type: [string, "null"], description: "Time zone for the consulting session range." }
            startTime: { type: string }
            endTime: { type: string }
            createdAt: { type: string, format: date-time }
