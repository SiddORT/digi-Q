          required: [id, userId, code, ownerAdminId, managingAdminId, managingAdminName, invitationStatus, status, createdAt]
          properties:
            id: { type: string }
            userId: { type: string }
            code: { type: string }
            managingAdminId: { type: string }
            managingAdminName: { type: string }
