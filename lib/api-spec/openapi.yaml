          required: [id, code, status, createdAt]
          properties:
            dateFormat: { $ref: "#/components/schemas/ClinicDateFormat" }
            timeFormat: { $ref: "#/components/schemas/ClinicTimeFormat" }
            linkedSchedule: { $ref: "#/components/schemas/LinkedSchedule" }
            effectiveEmail: { type: [string, "null"] }
            effectivePhone: { type: [string, "null"] }
            id: { type: string }
            code: { type: string }
            clinicName: { type: string }
            createdAt: { type: [string, "null"], format: date-time }
    DoctorInput:
      type: object
      required: [fullName, email]
      properties:
        country: { type: string, maxLength: 100, description: "ISO-2 or name; new entries default to IN" }
        state: { type: string, maxLength: 100 }
        city: { type: string, maxLength: 100 }
        pincode: { type: string, maxLength: 12 }
