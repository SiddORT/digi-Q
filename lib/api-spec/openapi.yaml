      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuthTokenPasswordInput" } } } }
      responses:
        "200": { description: Password reset, content: { application/json: { schema: { type: object, required: [reset], properties: { reset: { type: boolean } } } } } }
  /auth/invitation/accept:
    post:
