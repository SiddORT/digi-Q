        address: { type: string }
        country: { type: string }
        state: { type: string }
        city: { type: string }
        area: { type: string }
        pincode: { type: string }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        description: { type: string }
        clinicTypeId: { type: string }
        categoryId: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/RecordStatus" }
