  /guest-requests:
    get:
      operationId: listGuestRequests
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: sort, in: query, schema: { type: string, enum: [createdAt, "-createdAt", fullName, "-fullName", date, "-date"], default: "-createdAt" } }
