        city: { type: string, maxLength: 100 }
        pincode: { type: string, maxLength: 12 }
        address: { type: string, maxLength: 500 }
        fullName: { type: string, minLength: 1 }
        email: { type: string, format: email }
        mobile: { type: string }
        role: { $ref: "#/components/schemas/Role" }
