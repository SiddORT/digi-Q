openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: |
    ClinicFlow REST contract. Sessions resolve a database role. The HttpOnly, Secure,
    SameSite=Lax cookie contains an opaque native token by default for continuity,
    or an app-issued JWT when AUTH_SESSION_MODE=jwt is explicitly configured.
    Both modes are database-revocable with a fixed 12-hour lifetime, with no refresh
    endpoint. Changing modes invalidates old cookies. JWT_SIGNING_KEY must be a
    dedicated high-entropy secret of at least 32 UTF-8 bytes, configured before
    enabling JWT mode. Session issuance may return 503 AUTH_SESSION_UNCONFIGURED.
    Newly created passwords require at least 8 characters, ASCII letters and numbers,
    and at most 1024 UTF-8 bytes (enforced by the server).
    Super admins access all; clinic admins and receptionists are assignment-scoped;
    doctors access their own resources and relevant patients; patients access self only.
    All filters narrow authorized scope, never expand it. DELETE deactivates records
    with history. Lists contain real persisted data only. Queue clients poll every 30 seconds.
    Invalid input returns 400, unauthenticated 401, forbidden 403, missing 404,
    state/capacity conflicts 409, rate limiting 429, unavailable integrations 503.
servers:
  - url: /api
security:
  - NativeSession: []
paths:
  /geography:
    get:
      operationId: searchGeography
      parameters:
        - { in: query, name: kind, required: true, schema: { type: string, enum: [country, state, city] } }
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: country, description: ISO-2 code or English country name scoping states and cities, schema: { type: string, maxLength: 100 } }
        - { in: query, name: state, description: State/UT name scoping cities, schema: { type: string, maxLength: 100 } }
        - { in: query, name: city, description: "When given with kind=city, the response includes a compatible flag", schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Offline geographic directory suggestions; manual entry remains supported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeographySuggestions' }
  /public/geography:
    get:
      operationId: searchPublicGeography
      security: []
      parameters:
        - { in: query, name: kind, required: true, schema: { type: string, enum: [country, state, city] } }
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: country, schema: { type: string, maxLength: 100 } }
        - { in: query, name: state, schema: { type: string, maxLength: 100 } }
        - { in: query, name: city, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: "Public read-only, rate-limited directory suggestions (max 20)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeographySuggestions' }
  /public/pincode/{pin}:
    get:
      operationId: lookupPublicPincode
      security: []
      parameters:
        - { in: path, name: pin, required: true, schema: { type: string, pattern: '^[1-9][0-9]{5}$' } }
      responses:
        '200':
          description: "Localities for an Indian PIN from the official India Post directory (GODL-India). The user must pick a locality; district is context only."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PincodeLookup' }
  /settings/integrations/{provider}/check:
    post:
      operationId: checkIntegrationConnection
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [smtp, sms, storage] } }
      responses:
        "200": { description: Read-only verification results, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationCheck" } } } }
  /settings/integrations/storage:
    get:
      operationId: getStorageConfiguration
      responses:
        "200": { description: Non-secret storage settings, content: { application/json: { schema: { $ref: "#/components/schemas/StorageConfiguration" } } } }
  /management/system-users:
    get:
      operationId: getSystemUsers
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: clinicId, in: query, schema: { type: string } }
      responses:
        "200": { description: Staff only, content: { application/json: { schema: { $ref: "#/components/schemas/SystemUsersPage" } } } }
  /management/custom-roles:
    get:
      operationId: getCustomRoles
      responses:
        "200": { description: Roles and assignments, content: { application/json: { schema: { $ref: "#/components/schemas/CustomRoleConfiguration" } } } }
    put:
      operationId: saveCustomRoles
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CustomRoleConfiguration" } } }
      responses:
        "200": { description: Saved roles, content: { application/json: { schema: { $ref: "#/components/schemas/CustomRoleConfiguration" } } } }
  /management/permissions:
    get:
      operationId: getPermissionPolicy
      responses:
        "200": { description: Role capability restrictions, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionPolicy" } } } }
    put:
      operationId: savePermissionPolicy
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PermissionPolicyInput" } } }
      responses:
        "200": { description: Saved policy, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionPolicy" } } } }
  /management/logos:
    post:
      operationId: requestLogoUpload
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LogoUploadInput" } } }
      responses:
        "200": { description: Upload reservation, content: { application/json: { schema: { type: object, required: [id, uploadUrl], properties: { id: { type: string }, uploadUrl: { type: string } } } } } }
  /management/logos/{id}/file:
    put:
      operationId: uploadLocalLogo
      description: Authenticated same-origin local image upload. Requires the normal CSRF header.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          image/png: { schema: { $ref: "#/components/schemas/LogoBinary" } }
          image/jpeg: { schema: { $ref: "#/components/schemas/LogoBinary" } }
          image/webp: { schema: { $ref: "#/components/schemas/LogoBinary" } }
      responses:
        "204": { description: Validated image stored }
  /management/logos/{id}/complete:
    post:
      operationId: completeLogoUpload
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Validated logo, content: { application/json: { schema: { type: object, required: [logoUrl], properties: { logoUrl: { type: string } } } } } }
  /management/templates:
    get:
      operationId: getNotificationTemplates
      parameters:
        - { in: query, name: clinicId, schema: { type: string } }
        - { in: query, name: recipient, schema: { type: string, enum: [patient, clinicAdmin, doctor, receptionist] } }
      responses:
        "200":
          description: Authorized template drafts and effective published content. Reading never sends a message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplateCatalog" }
    put:
      operationId: saveNotificationTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationTemplateSave" }
      responses:
        "200":
          description: Updated authorized catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplateCatalog" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /settings/integrations:
    put:
      operationId: updateIntegrationSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationUpdate" }
      responses:
        "200":
          description: Updated readiness; credentials are never returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: getIntegrationSettings
      description: Super Admin only. Environment readiness only; never returns configuration values.
      responses:
        "200":
          description: Configuration readiness (not a provider connectivity check)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationSettings" }
        "401": { description: Sign in required }
        "403": { description: Super Admin required }
  /settings/integrations/smtp/test-email:
    post:
      operationId: sendSmtpTestEmail
      description: Super Admin only. Sends a fixed DigiQ Doctors test message. Rate limited by user and IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmtpTestInput" }
      responses:
        "200":
          description: Provider accepted the message; inbox delivery is not confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmtpTestResult" }
        "400": { description: Invalid recipient }
        "401": { description: Sign in required }
        "403": { description: Super Admin required }
        "429": { description: Test email limit reached }
        "503": { description: Email unavailable }
  /demo/login:
    post:
      operationId: demoLogin
      security: []
      description: Dedicated demo identity only. Local Argon2id password verification issues a scoped HttpOnly session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoLoginInput" }
      responses:
        "200":
          description: Native demo session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthAuthenticated" }
  /demo/setup:
    get:
      operationId: getDemoSetup
      description: Super Admin only
      responses:
        "200":
          description: Demo setup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSetupStatus" }
    post:
      operationId: createDemoSetup
      description: Explicit Super Admin creation; initial password is returned once only and stored only as Argon2id hash
      responses:
        "200":
          description: Newly created setup, or existing state without password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSetupStatus" }
    patch:
      operationId: updateDemoSetup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoSetupAction" }
      responses:
        "200":
          description: Updated setup, one-time password on rotation only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSetupStatus" }
  /session-contexts:
    get:
      operationId: getSessionContexts
      description: Scope-checked staff operational sessions, merging current templates with persisted appointment snapshots. Historical-only sessions never authorize new booking. Select using startTime as well as sessionId because one template can have multiple historical timings.
      parameters:
        - { name: doctorId, in: query, required: true, schema: { type: string } }
        - { name: branchId, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: Operational session contexts without patient data, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SessionContext" } } } } }
  /public/registration-options:
    get:
      operationId: getRegistrationOptions
      security: []
      responses:
        "200": { description: Active public registration reference options only, content: { application/json: { schema: { $ref: "#/components/schemas/RegistrationOptions" } } } }
  /clinic-registration:
    post:
      operationId: registerClinic
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicRegistrationInput" } } } }
      responses:
        "201": { description: Atomic clinic registration, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicSettingsResult" } } } }
  /clinics/{id}/settings:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: getClinicSettings
      responses:
        "200": { description: Clinic settings, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicSettingsResult" } } } }
    patch:
      operationId: updateClinicSettings
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicSettingsInput" } } } }
      responses:
        "200": { description: Saved atomically, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicSettingsResult" } } } }
  /clinics/{id}/settings/preview:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    post:
      operationId: previewClinicSettings
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicSettingsInput" } } } }
      responses:
        "200": { description: Advisory linked schedule impact, content: { application/json: { schema: { $ref: "#/components/schemas/ClinicSettingsPreview" } } } }
  /me/doctor-profile:
    post:
      operationId: attachOwnDoctorProfile
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OwnDoctorProfileInput" } } } }
      responses:
        "200": { description: Own clinical capability, content: { application/json: { schema: { $ref: "#/components/schemas/Doctor" } } } }
  /public/slug-availability:
    get:
      operationId: checkSlugAvailability
      security: []
      parameters:
        - { name: slug, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 63 } }
        - { name: clinicId, in: query, schema: { type: string } }
      responses:
        "200": { description: Advisory availability, content: { application/json: { schema: { $ref: "#/components/schemas/SlugAvailability" } } } }
  /public/clinics-by-slug/{clinicSlug}:
    get:
      operationId: resolveClinicSlug
      security: []
      parameters:
        - { name: clinicSlug, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/PublicDirectory" }
        - { $ref: "#/components/parameters/PublicDirectoryPage" }
        - { $ref: "#/components/parameters/PublicDirectoryPageSize" }
        - { $ref: "#/components/parameters/PublicDirectorySearch" }
        - { $ref: "#/components/parameters/PublicDirectorySort" }
      responses:
        "200": { description: Active clinic context, content: { application/json: { schema: { $ref: "#/components/schemas/PublicClinicContext" } } } }
  /public/clinics-by-slug/{clinicSlug}/{branchSlug}:
    get:
      operationId: resolveBranchSlug
      security: []
      parameters:
        - { name: clinicSlug, in: path, required: true, schema: { type: string } }
        - { name: branchSlug, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/PublicDirectory" }
        - { $ref: "#/components/parameters/PublicDirectoryPage" }
        - { $ref: "#/components/parameters/PublicDirectoryPageSize" }
        - { $ref: "#/components/parameters/PublicDirectorySearch" }
        - { $ref: "#/components/parameters/PublicDirectorySort" }
      responses:
        "200": { description: Active branch context, content: { application/json: { schema: { $ref: "#/components/schemas/PublicClinicContext" } } } }
  /doctors/{id}/presence:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      operationId: getDoctorPresence
      parameters:
        - { name: branchId, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: sessionId, in: query, schema: { type: string } }
        - { name: startTime, in: query, schema: { type: string } }
      responses:
        "200": { description: Live availability, content: { application/json: { schema: { $ref: "#/components/schemas/DoctorPresence" } } } }
    patch:
      operationId: updateDoctorPresence
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DoctorPresenceInput" } } } }
      responses:
        "200": { description: Saved; future bookings unchanged, content: { application/json: { schema: { $ref: "#/components/schemas/DoctorPresence" } } } }
  /booking/schedule-access:
    get:
      operationId: getBookingScheduleAccess
      parameters:
        - { name: doctorId, in: query, required: true, schema: { type: string } }
        - { name: branchId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Verified contextual schedule management capability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingScheduleAccess" }
  /public/availability/context:
    get:
      operationId: getPublicBookingContext
      parameters:
        - { name: doctorId, in: query, required: true, schema: { type: string } }
        - { name: branchId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Public booking date boundaries, independent of daily sessions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicBookingContext" }
  /public/availability/sessions:
    get:
      operationId: getPublicAvailabilitySessions
      security: []
      parameters:
        - { name: doctorId, in: query, required: true, schema: { type: string } }
        - { name: branchId, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: Separate sessions, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Availability" } } } } }
  /public/guest-requests:
    post:
      operationId: createGuestRequest
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GuestRequestInput" } } } }
      responses:
        "201": { description: Immediately allocated appointment and private receipt (idempotent replay returns same ticket), content: { application/json: { schema: { $ref: "#/components/schemas/GuestReceipt" } } } }
  /public/guest-receipt:
    post:
      operationId: getGuestReceipt
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GuestReceiptInput" } } } }
      responses:
        "200": { description: Own request receipt only, content: { application/json: { schema: { $ref: "#/components/schemas/GuestReceipt" } } } }
  /guest-requests:
    get:
      operationId: listGuestRequests
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: sort, in: query, schema: { type: string, enum: [createdAt, "-createdAt", fullName, "-fullName", date, "-date"], default: "-createdAt" } }
        - { $ref: "#/components/parameters/SessionId" }
        - { $ref: "#/components/parameters/StartTime" }
        - { name: clinicId, in: query, schema: { type: string } }
        - { name: branchId, in: query, schema: { type: string } }
        - { name: doctorId, in: query, schema: { type: string } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: string, enum: [pending, confirmed, rejected] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Scoped requests, content: { application/json: { schema: { $ref: "#/components/schemas/GuestRequestList" } } } }
  /guest-requests/{id}/decision:
    post:
      operationId: decideGuestRequest
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GuestDecisionInput" } } } }
      responses:
        "200": { description: Decided request, content: { application/json: { schema: { $ref: "#/components/schemas/StaffGuestRequest" } } } }
  /healthz:
    get:
      operationId: healthCheck
      security: []
      responses:
        "200": { description: Healthy, content: { application/json: { schema: { $ref: "#/components/schemas/HealthStatus" } } } }
  /auth/csrf:
    get:
      operationId: getAuthCsrf
      security: []
      responses:
        "200": { description: CSRF cookie and token, content: { application/json: { schema: { type: object, required: [csrfToken], properties: { csrfToken: { type: string } } } } } }
  /auth/login:
    post:
      operationId: nativeStaffLogin
      security: []
      description: Verify the local staff password with Argon2id and create a session directly. No email code or SMTP delivery is required.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/NativeStaffLoginInput" } } } }
      responses:
        "200": { description: Staff session created, content: { application/json: { schema: { $ref: "#/components/schemas/StaffLoginResponse" } } } }
        "503": { description: "Session issuance unavailable; code AUTH_SESSION_UNCONFIGURED when session mode or signing key is invalid." }
  /auth/verify-device:
    post:
      operationId: verifyStaffDevice
      deprecated: true
      description: Retired compatibility tombstone. Use staff email and password login; no payload can create a session.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuthCodeInput" } } } }
      responses:
        "410": { description: "Device verification retired; code AUTH_METHOD_REMOVED. No session is issued." }
        "503": { description: "Session issuance unavailable; code AUTH_SESSION_UNCONFIGURED when session mode or signing key is invalid." }
  /auth/patient/start:
    post:
      operationId: startPatientEmail
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuthEmailInput" } } } }
      responses:
        "200": { description: Patient challenge, content: { application/json: { schema: { $ref: "#/components/schemas/AuthChallenge" } } } }
  /auth/patient/verify:
    post:
      operationId: verifyPatientEmail
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuthCodeInput" } } } }
      responses:
        "200": { description: Patient session created, content: { application/json: { schema: { $ref: "#/components/schemas/AuthAuthenticated" } } } }
        "503": { description: "Session issuance unavailable; code AUTH_SESSION_UNCONFIGURED when session mode or signing key is invalid." }
  /auth/register/start:
    post:
      operationId: startClinicRegistration
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StartClinicRegistrationInput" } } } }
      responses:
        "200": { description: Registration challenge, content: { application/json: { schema: { $ref: "#/components/schemas/AuthChallenge" } } } }
  /auth/registration/resend:
    post:
      operationId: resendClinicRegistration
      security: []
      description: Resends the registration verification code for the existing challenge without changing its ID or original expiry. Uses the anonymous CSRF cookie and matching CSRF request header; no authenticated session is required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationChallengeReference" }
      responses:
        "200":
          description: Code sent for the same stable challenge ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationChallengeReference" }
        "400":
          description: Invalid or expired challenge (INVALID_VERIFICATION)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "429":
          description: Resend cooldown (REGISTRATION_RESEND_COOLDOWN); IP abuse limits may also return rate limiting
          headers:
            Retry-After:
              description: Cooldown retry delay, 60 seconds for REGISTRATION_RESEND_COOLDOWN
              schema: { type: string, example: "60" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /auth/register/verify:
    post:
      operationId: verifyClinicRegistration
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuthCodeInput" } } } }
      responses:
        "200": { description: Administrator created, content: { application/json: { schema: { $ref: "#/components/schemas/AuthAuthenticated" } } } }
  /auth/forgot-password:
    post:
      operationId: requestPasswordRecovery
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuthEmailInput" } } } }
      responses:
        "200": { description: Generic response independent of account existence, content: { application/json: { schema: { type: object, required: [sent], properties: { sent: { type: boolean } } } } } }
  /auth/reset-password:
    post:
      operationId: resetNativePassword
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuthTokenPasswordInput" } } } }
      responses:
        "200": { description: Password reset, content: { application/json: { schema: { type: object, required: [reset], properties: { reset: { type: boolean } } } } } }
  /auth/invitation/accept:
    post:
      operationId: acceptStaffInvitation
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuthTokenPasswordInput" } } } }
