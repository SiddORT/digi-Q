          type: object
          properties:
            clinics: { $ref: "#/components/schemas/PageMeta" }
            branches: { $ref: "#/components/schemas/PageMeta" }
    PublicDoctor:
      type: object
      required: [id, fullName, clinicIds, branchIds]
      properties:
        averageConsultationMinutes: { type: [number, "null"], description: Actual mean of valid completed consultation timestamps, never an expected duration. }
        expectedDurationMinutes: { type: [integer, "null"], description: Explicit clinic duration configuration, not learned from completed consultations. }
        id: { type: string }
        fullName: { type: string }
        photoUrl: { type: string }
        specializationName: { type: string }
        qualificationNames: { type: array, items: { type: string } }
        about: { type: string }
        experienceYears: { type: integer }
