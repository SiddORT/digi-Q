      type: object
      required: [mobile]
      properties:
        mobile: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
    OtpChallenge:
      type: object
      required: [challengeId, expiresAt, resendAfterSeconds, provider]
      properties:
