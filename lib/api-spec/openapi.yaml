        email: { type: [string, "null"], format: email }
        inheritEmail: { type: boolean }
        inheritPhone: { type: boolean }
        openingHours: { type: [array, "null"], maxItems: 28, description: Null or absent is legacy unrestricted; empty array means closed all days., items: { $ref: "#/components/schemas/OpeningHour" } }
        clinicId: { type: string }
        name: { type: string, minLength: 1 }
        address: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        phone: { type: [string, "null"] }
        timezone: { type: string, default: Asia/Kolkata }
        status: { $ref: "#/components/schemas/RecordStatus" }
    Branch:
      allOf:
        - { $ref: "#/components/schemas/BranchInput" }
