        expectedDurationMinutes: { type: integer, enum: [20, 30, 60] }
        effect: { type: string, enum: [futureOnly, runningSession], description: Both choices update sessions that have not started, including already-booked future sessions. Running-session snapshots change only for an explicitly confirmed selected session. Past sessions remain unchanged. }
