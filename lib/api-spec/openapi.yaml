openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: |
    ClinicFlow REST contract. Sessions resolve a database role. The HttpOnly, Secure,
    SameSite=Lax cookie contains an opaque native token by default for continuity,
    or an app-issued JWT when AUTH_SESSION_MODE=jwt is explicitly configured.
    Both modes are database-revocable with a fixed 12-hour lifetime, with no refresh
    endpoint. Changing modes invalidates old cookies. JWT_SIGNING_KEY must be a
    dedicated high-entropy secret of at least 32 UTF-8 bytes, configured before
    enabling JWT mode. Session issuance may return 503 AUTH_SESSION_UNCONFIGURED.
    Newly created passwords require at least 8 characters, ASCII letters and numbers,
    and at most 1024 UTF-8 bytes (enforced by the server).
    Super admins access all; clinic admins and receptionists are assignment-scoped;
    doctors access their own resources and relevant patients; patients access self only.
    All filters narrow authorized scope, never expand it. DELETE deactivates records
    with history. Lists contain real persisted data only. Queue clients poll every 30 seconds.
    Invalid input returns 400, unauthenticated 401, forbidden 403, missing 404,
    state/capacity conflicts 409, rate limiting 429, unavailable integrations 503.
servers:
  - url: /api
security:
  - NativeSession: []
paths:
  /live-ticket-links:
    post:
      operationId: issueLiveTicketLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LiveTicketLinkInput" }
      responses:
        "200":
          description: Private read-only link; only its hash is stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveTicketLink" }
  /public/live-ticket:
    post:
      operationId: readLiveTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LiveTicketAccess" }
      responses:
        "200":
          description: Minimal status; personal appointment only for verified signed-in owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveTicket" }
        "404": { description: "Invalid, expired or revoked link" }
  /appointments/{id}/live-ticket-links:
    delete:
      operationId: revokeLiveTicketLinks
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: All existing links revoked }
  /staff-verification:
    get:
      operationId: getStaffVerification
      responses:
        "200":
          description: Current staff-owned contact verification status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffContactStatus" }
  /staff-verification/request:
    post:
      operationId: requestStaffContactCode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffContactRequest" }
      responses:
        "200":
          description: Code accepted for delivery; inbox receipt is not confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffContactChallenge" }
  /staff-verification/confirm:
    post:
      operationId: confirmStaffContactCode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffContactConfirmation" }
      responses:
        "200":
          description: Contact verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffContactVerified" }
  /staff-verification/defer:
    post:
      operationId: deferStaffVerification
      responses:
        "200":
          description: Prompt deferred; controls remain available in Profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffContactDeferred" }
  /public/website-config:
    get:
      operationId: getPublicWebsiteConfig
      security: []
      responses:
        '200':
          description: Validated root-hosted public website authority only. Never cache across deployments.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [publicOrigin]
                properties:
                  publicOrigin: { type: string, format: uri }
        '503':
          description: Public website links are not configured. Retry after operator correction.
  /me/notification-settings:
    get:
      operationId: getMyNotificationSettings
      responses:
        '200':
          description: Saved personal choices and effective delivery restrictions; never credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalNotificationSettings' }
    put:
      operationId: saveMyNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalNotificationInput' }
      responses:
        '200':
          description: Saved with optimistic revision protection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalNotificationSettings' }
  /management/notification-settings:
    get:
      operationId: getManagedNotificationSettings
      parameters:
        - { in: query, name: clinicId, schema: { type: string } }
      responses:
        '200':
          description: Authorized scope gate and published activation controls.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedNotificationSettings' }
    put:
      operationId: saveManagedNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedNotificationInput' }
      responses:
        '200':
          description: Atomic scoped batch; drafts and unrelated policy preserved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedNotificationSettings' }
  /geography:
    get:
      operationId: searchGeography
      parameters:
        - { in: query, name: kind, required: true, schema: { type: string, enum: [country, state, city] } }
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: country, description: ISO-2 code or English country name scoping states and cities, schema: { type: string, maxLength: 100 } }
        - { in: query, name: state, description: State/UT name scoping cities, schema: { type: string, maxLength: 100 } }
        - { in: query, name: city, description: "When given with kind=city, the response includes a compatible flag", schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Offline geographic directory suggestions; manual entry remains supported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeographySuggestions' }
  /public/geography:
    get:
      operationId: searchPublicGeography
      security: []
      parameters:
        - { in: query, name: kind, required: true, schema: { type: string, enum: [country, state, city] } }
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: country, schema: { type: string, maxLength: 100 } }
        - { in: query, name: state, schema: { type: string, maxLength: 100 } }
        - { in: query, name: city, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: "Public read-only, rate-limited directory suggestions (max 20)."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeographySuggestions' }
  /public/pincode/{pin}:
    get:
      operationId: lookupPublicPincode
      security: []
      parameters:
        - { in: path, name: pin, required: true, schema: { type: string, pattern: '^[1-9][0-9]{5}$' } }
      responses:
        '200':
          description: "Localities for an Indian PIN from the official India Post directory (GODL-India). The user must pick a locality; district is context only."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PincodeLookup' }
  /settings/integrations/{provider}/check:
    post:
      operationId: checkIntegrationConnection
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [smtp, sms, storage] } }
      responses:
        "200": { description: Read-only verification results, content: { application/json: { schema: { $ref: "#/components/schemas/IntegrationCheck" } } } }
  /settings/integrations/storage:
    get:
      operationId: getStorageConfiguration
      responses:
        "200": { description: Non-secret storage settings, content: { application/json: { schema: { $ref: "#/components/schemas/StorageConfiguration" } } } }
  /management/system-users:
    get:
      operationId: getSystemUsers
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: search, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: clinicId, in: query, schema: { type: string } }
      responses:
        "200": { description: Staff only, content: { application/json: { schema: { $ref: "#/components/schemas/SystemUsersPage" } } } }
  /management/system-users/{id}/deletion-impact:
    get:
      operationId: getStaffDeletionImpact
      description: Live Superadmin-only staff impact. A blocked review does not authorize deletion.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Exact-row impact, content: { application/json: { schema: { $ref: "#/components/schemas/StaffDeletionImpact" } } } }
        "401": { description: Sign-in required }
        "403": { description: Real active Superadmin required }
        "404": { description: Staff account not found }
  /management/system-users/{id}/notification-history-review:
    get:
      operationId: getStaffHistoryReview
      description: Superadmin-only bounded scan of unproven history. Unknown ownership can block any staff removal.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Safe metadata only, content: { application/json: { schema: { $ref: "#/components/schemas/HistoryReviewPage" } } } }
        "403": { description: Active native non-demo Superadmin required }
  /management/system-users/{id}/notification-history-review/scan:
    post:
      operationId: scanStaffHistoryReview
      description: Read-only cursor scan; no history or account changes.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HistoryReviewCursorInput" } } }
      responses:
        "200": { description: Safe metadata only, content: { application/json: { schema: { $ref: "#/components/schemas/HistoryReviewPage" } } } }
  /management/system-users/{id}/notification-history-review/preview:
    post:
      operationId: previewStaffHistoryEvidence
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HistoryEvidenceInput" } } }
      responses:
        "200": { description: Evidence checked without writes, content: { application/json: { schema: { $ref: "#/components/schemas/HistoryEvidenceReview" } } } }
        "409": { description: History changed; refresh review }
  /management/system-users/{id}/notification-history-review/restore:
    post:
      operationId: restoreStaffHistoryEvidence
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HistoryEvidenceCommit" } } }
      responses:
        "200": { description: Original proof restored; no account or history deleted, content: { application/json: { schema: { $ref: "#/components/schemas/HistoryReconciliationResult" } } } }
        "409": { description: "Stale, expired, busy or mismatched evidence; no changes committed" }
  /management/system-users/{id}/notification-history-review/unresolved:
    post:
      operationId: markStaffHistoryUnresolved
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/HistoryUnresolvedInput" } } }
      responses:
        "200": { description: Explicit unresolved decision retained; deletion stays blocked, content: { application/json: { schema: { $ref: "#/components/schemas/HistoryReconciliationResult" } } } }
        "409": { description: History changed; refresh review }
  /management/system-users/{id}/permanent-removal:
    post:
      operationId: permanentlyRemoveStaff
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StaffRemovalInput" } } }
      responses:
        "200": { description: Account removed; file cleanup may still be pending, content: { application/json: { schema: { $ref: "#/components/schemas/StaffRemovalReceipt" } } } }
        "400": { description: Exact lowercase delete confirmation required }
        "401": { description: Native session required }
        "403": { description: Active non-demo Superadmin required }
        "409": { description: Stale review or unresolved dependencies; no account changes committed }
  /management/staff-removals/{operationId}:
    get:
      operationId: getStaffRemovalReceipt
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Durable removal receipt, content: { application/json: { schema: { $ref: "#/components/schemas/StaffRemovalReceipt" } } } }
        "404": { description: No committed receipt }
  /management/staff-removals/{operationId}/retry-cleanup:
    post:
      operationId: retryStaffRemovalCleanup
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Updated cleanup receipt, content: { application/json: { schema: { $ref: "#/components/schemas/StaffRemovalReceipt" } } } }
  /management/system-users/{id}/handoff-options:
    get:
      operationId: getStaffHandoffOptions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "Candidate options, never a guarantee of eligibility", content: { application/json: { schema: { $ref: "#/components/schemas/StaffHandoffOptions" } } } }
  /management/system-users/{id}/handoff-impact:
    post:
      operationId: reviewStaffHandoff
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StaffHandoffSelection" } } }
      responses:
        "200": { description: Signed separately reviewed handoff, content: { application/json: { schema: { $ref: "#/components/schemas/StaffHandoffReview" } } } }
        "409": { description: "Ineligible visit, responsibility, scope or capacity" }
  /management/system-users/{id}/handoff:
    post:
      operationId: commitStaffHandoff
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StaffHandoffApproval" } } }
      responses:
        "200": { description: Committed handoff; account still exists, content: { application/json: { schema: { $ref: "#/components/schemas/StaffHandoffReceipt" } } } }
        "409": { description: Review expired or dependencies changed; handoff rolled back }
  /management/custom-roles:
    get:
      operationId: getCustomRoles
      responses:
        "200": { description: Roles and assignments, content: { application/json: { schema: { $ref: "#/components/schemas/CustomRoleConfiguration" } } } }
    put:
      operationId: saveCustomRoles
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CustomRoleConfiguration" } } }
      responses:
        "200": { description: Saved roles, content: { application/json: { schema: { $ref: "#/components/schemas/CustomRoleConfiguration" } } } }
  /management/permissions:
    get:
      operationId: getPermissionPolicy
      responses:
        "200": { description: Role capability restrictions, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionPolicy" } } } }
    put:
      operationId: savePermissionPolicy
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PermissionPolicyInput" } } }
      responses:
        "200": { description: Saved policy, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionPolicy" } } } }
  /management/logos:
    post:
      operationId: requestLogoUpload
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LogoUploadInput" } } }
      responses:
        "200": { description: Upload reservation, content: { application/json: { schema: { type: object, required: [id, uploadUrl], properties: { id: { type: string }, uploadUrl: { type: string } } } } } }
  /management/logos/{id}/file:
    put:
      operationId: uploadLocalLogo
      description: Authenticated same-origin local image upload. Requires the normal CSRF header.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          image/png: { schema: { $ref: "#/components/schemas/LogoBinary" } }
          image/jpeg: { schema: { $ref: "#/components/schemas/LogoBinary" } }
          image/webp: { schema: { $ref: "#/components/schemas/LogoBinary" } }
      responses:
        "204": { description: Validated image stored }
  /management/logos/{id}/complete:
    post:
      operationId: completeLogoUpload
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Validated logo, content: { application/json: { schema: { type: object, required: [logoUrl], properties: { logoUrl: { type: string } } } } } }
  /management/templates:
    get:
      operationId: getNotificationTemplates
      parameters:
        - { in: query, name: clinicId, schema: { type: string } }
        - { in: query, name: recipient, schema: { type: string, enum: [patient, clinicAdmin, doctor, receptionist, superAdmin] } }
        - { in: query, name: channel, schema: { type: string, enum: [email, sms] } }
      responses:
        "200":
          description: Authorized template drafts and effective published content. Reading never sends a message.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplateCatalog" }
    put:
      operationId: saveNotificationTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationTemplateSave" }
      responses:
        "200":
          description: Updated authorized catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationTemplateCatalog" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /management/templates/preview:
    post:
      operationId: previewEventTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventTemplateTestInput" }
      responses:
        "200":
          description: Rendered explicit sample values, no send
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventTemplateTestResult" }
  /management/templates/test:
    post:
      operationId: testEventTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventTemplateTestInput" }
      responses:
        "200":
          description: Sanitized outcome; never a delivery guarantee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventTemplateTestResult" }
  /management/event-controls:
    get:
      operationId: getEventControls
      parameters:
        - { in: query, name: clinicId, schema: { type: string } }
      responses:
        "200":
          description: Effective published policies and readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventControlCatalog" }
    put:
      operationId: updateEventControl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventControlInput" }
      responses:
        "200":
          description: Updated effective policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventControlCatalog" }
  /settings/integrations:
    put:
      operationId: updateIntegrationSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationUpdate" }
      responses:
        "200":
          description: Updated readiness; credentials are never returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationSettings" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    get:
      operationId: getIntegrationSettings
      description: Super Admin only. Environment readiness only; never returns configuration values.
      responses:
        "200":
          description: Configuration readiness (not a provider connectivity check)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationSettings" }
        "401": { description: Sign in required }
        "403": { description: Super Admin required }
  /settings/integrations/smtp/test-receipt:
    get:
      operationId: getSmtpTestReceipt
      description: Latest SMTP test for the signed-in non-demo Superadmin. Receipt is a manual assertion, never delivery proof.
      responses:
        "200":
          description: Latest test and manual receipt status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmtpReceiptResult" }
        "403": { description: Super Admin required }
    post:
      operationId: confirmSmtpTestReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmtpReceiptInput" }
      responses:
        "200":
          description: User-confirmed receipt saved without sending mail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmtpReceiptResult" }
        "400": { description: Invalid confirmation }
        "403": { description: Super Admin required }
        "409": { description: Test or saved configuration changed }
  /settings/integrations/smtp/test-email:
    post:
      operationId: sendSmtpTestEmail
      description: Super Admin only. Sends a fixed DigiQ Doctors test message. Rate limited by user and IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmtpTestInput" }
      responses:
        "200":
          description: Provider accepted the message; inbox delivery is not confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmtpTestResult" }
        "400": { description: Invalid recipient }
        "401": { description: Sign in required }
        "403": { description: Super Admin required }
        "429": { description: Test email limit reached }
        "503": { description: Email unavailable }
  /settings/integrations/notification-sms/test-message:
    post:
      operationId: sendNotificationSmsTestMessage
      description: Super Admin only. Explicitly sends one test using saved notification SMS configuration, without activating clinic notifications.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSmsTestInput" }
      responses:
        "200":
          description: Sanitized dispatch outcome; provider acceptance does not confirm delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSmsTestResult" }
        "400": { description: Invalid recipient or message }
        "401": { description: Sign in required }
        "403": { description: Super Admin required }
        "429": { description: Test limit reached }
        "503": { description: SMS configuration unavailable }
  /demo/login:
    post:
      operationId: demoLogin
      security: []
      description: Dedicated demo identity only. Local Argon2id password verification issues a scoped HttpOnly session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoLoginInput" }
      responses:
        "200":
          description: Native demo session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthAuthenticated" }
  /demo/setup:
    get:
      operationId: getDemoSetup
      description: Super Admin only
      responses:
        "200":
          description: Demo setup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSetupStatus" }
    post:
      operationId: createDemoSetup
      description: Explicit Super Admin creation; initial password is returned once only and stored only as Argon2id hash
      responses:
        "200":
          description: Newly created setup, or existing state without password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSetupStatus" }
    patch:
      operationId: updateDemoSetup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DemoSetupAction" }
      responses:
        "200":
          description: Updated setup, one-time password on rotation only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoSetupStatus" }
  /queue-sessions:
    get:
      operationId: listQueueSessions
      description: Paginated staff-only session overview in the effective authorized workspace. Includes empty scheduled sessions and persisted appointment session snapshots for one local date. Counts contain no patient records. available describes an open session template, not booking eligibility or permission to perform actions; drill down to the operational queue for authoritative checks.
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: clinicId, in: query, schema: { type: string } }
        - { name: branchId, in: query, schema: { type: string } }
        - { name: doctorId, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Authorized session summaries without patient data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueSessionList" }
        "401": { description: Authentication required }
        "403": { description: Staff role required }
  /session-contexts:
    get:
      operationId: getSessionContexts
      description: Scope-checked staff operational sessions, merging current templates with persisted appointment snapshots. Historical-only sessions never authorize new booking. Select using startTime as well as sessionId because one template can have multiple historical timings.
      parameters:
        - { name: doctorId, in: query, required: true, schema: { type: string } }
        - { name: branchId, in: query, required: true, schema: { type: string } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: Operational session contexts without patient data, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SessionContext" } } } } }
