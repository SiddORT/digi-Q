      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuthTokenPasswordInput" } } } }
      responses:
        "200": { description: Session created, content: { application/json: { schema: { $ref: "#/components/schemas/AuthAuthenticated" } } } }
  /auth/change-password:
    post:
      operationId: changeNativePassword
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ChangeNativePasswordInput" } } } }
      responses:
